# Example only. Keep the real provider/model mapping in local configuration.
#
# `scripts/gen-agents` resolves the map in this order and stops at the first hit:
#   1. --model-map PATH
#   2. $XDG_CONFIG_HOME/agent-scaffolding/model-map.yaml
#   3. $HOME/.config/agent-scaffolding/model-map.yaml
#   4. this example
#
# This example uses code names, not provider model ids, so it is never installed
# into a host: `scaffolding install --agents --host H --apply` stops until a local
# map exists.
#
# Model ids are NOT portable across hosts: an OpenAI id in a Claude definition is
# rejected outright. The alias is the portable part of the contract; each host
# resolves its own id. A host with no `model_<host>` for an alias stops the
# generator rather than borrowing another host's id.
#
# Fields per entry:
#   id            portable alias, or `diagnostic` for the opt-in diagnostic rung
#   model_codex   model id for Codex; a code name here
#   model_claude  model id for Claude; a code name here
#   effort        reasoning effort requested from that model
#
# Note the shape below: a host may collapse two aliases onto one model when it
# cannot express the difference. Codex separates `economy` from `balanced` by
# effort on the same curve; a host with no reasoning-effort field cannot, so both
# land on the same id. That collapse is a degradation to record, not a mapping
# error.
aliases:
  - id: economy
    model_codex: luna
    model_claude: mid
    effort: high
    use: "docs, extraction, bounded exploration, mechanical fixes"
  - id: balanced
    model_codex: luna
    model_claude: mid
    effort: xhigh
    use: "multi-file exploration, implementation against a frozen contract"
  - id: frontier
    model_codex: sol
    model_claude: top
    effort: xhigh
    use: "critical seam, inseparable reasoning, reviewers"
  - id: critical
    model_codex: sol
    model_claude: top
    effort: max
    use: "exceptional final audit only"
  # A rung a host does not offer is simply absent for that host. Nothing borrows
  # an id from elsewhere to fill the gap.
  - id: diagnostic
    model_codex: terra
    effort: high
    use: "opt-in rung to separate a capacity failure from a bad brief; never a role default"
